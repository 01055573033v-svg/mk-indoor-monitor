<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>실내 로라 모니터</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <strong>실내 로라 모니터 <small>2단계 · 세션 요약만 이 크롬에 저장</small></strong>
    <div class="actions">
      <button id="connect" type="button">동글 연결</button>
      <button id="mock" type="button">모의 센서</button>
      <button id="session-btn" type="button">훈련 세션</button>
      <button id="history-btn" type="button">기록</button>
      <button id="pair" type="button" aria-pressed="false">센서 짝 맞추기</button>
      <button id="settings-btn" type="button">설정</button>
      <button id="size" type="button">타일 크기</button>
      <button id="full" type="button">전체 화면</button>
    </div>
  </header>
  <p id="notice" class="notice" role="status" hidden></p>
  <section id="dongles" class="dongles" aria-label="동글 상태"></section>
  <section id="session" class="session" hidden aria-label="훈련 세션 진행">
    <div class="now"><b id="s-step"></b> <span id="s-range"></span> <span class="big" id="s-left"></span></div>
    <div class="meta"><span id="s-name"></span> · <span id="s-total"></span> · 다음 <span id="s-next"></span></div>
    <svg id="s-profile" class="profile" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div class="ctl"><button id="s-pause" type="button">일시정지</button><button id="s-stop" type="button">끝내기</button></div>
  </section>
  <main id="board" class="board size-2" aria-live="off"></main>
  <section id="unpaired" class="panel" hidden aria-label="짝 없는 센서"></section>
  <dialog id="settings">
    <form method="dialog">
      <h2>설정 <small>이 맥북 크롬에만 저장 · 실명 넣지 않음(P코드만)</small></h2>
      <label>인원 <input id="athletes" type="number" min="1" max="24" step="1"></label>
      <label>ANT+ 네트워크 키 <input id="netkey" type="password" autocomplete="off" placeholder="16자리 16진수(동글 연결에만 필요)"></label>
      <p class="row">V2 명단 파일(FTP·그룹, P코드만) <input id="roster-file" type="file" accept=".json,application/json"> <button type="button" id="roster-export">지금 명단 내려받기</button></p>
      <div id="ftp-list" class="ftp-list"></div>
      <menu><button value="save" id="save-settings">저장</button><button value="cancel" formnovalidate>닫기</button></menu>
    </form>
  </dialog>
  <dialog id="session-dialog">
    <form method="dialog">
      <h2>훈련 세션 시작</h2>
      <label>세션 <select id="preset"></select></label>
      <label>대상 그룹 <select id="target-group"><option value="">전체</option><option>중E</option><option>중S</option><option>고E</option><option>고S</option></select></label>
      <label>세션 파일(JSON) <input id="plan-file" type="file" accept=".json,application/json"></label>
      <svg id="preview" class="profile" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <ol id="preview-steps" class="steps"></ol>
      <menu><button value="start" id="start-session">시작</button><button value="cancel" formnovalidate>닫기</button></menu>
    </form>
  </dialog>
  <dialog id="result" class="wide">
    <form method="dialog">
      <h2 id="r-title">세션 결과</h2>
      <p id="r-meta" class="muted"></p>
      <div class="scroll"><table id="r-table"></table></div>
      <menu><button type="button" id="r-csv">CSV 내려받기</button><button type="button" id="r-json">JSON 내려받기</button><button value="close">닫기</button></menu>
    </form>
  </dialog>
  <dialog id="history" class="wide">
    <form method="dialog">
      <h2>지난 세션 <small>이 크롬에만 · 최근 30개 · 요약만</small></h2>
      <div class="scroll"><table id="h-table"></table></div>
      <menu><button value="close">닫기</button></menu>
    </form>
  </dialog>
  <script type="module" src="src/app.js"></script>
</body>
</html>
